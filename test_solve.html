<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>حل الاختبار | البابل شيت الذكي</title>
    <!-- Favicon & Home Screen App Icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%231e3a8a'/%3E%3Cstop offset='100%25' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Crect x='14' y='16' width='14' height='14' rx='4' fill='none' stroke='%23ffffff' stroke-width='3.5'/%3E%3Cpath d='M17.5 23l3 3 5.5-6' fill='none' stroke='%2334d399' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cline x1='34' y1='23' x2='50' y2='23' stroke='%23ffffff' stroke-width='3.5' stroke-linecap='round'/%3E%3Crect x='14' y='36' width='14' height='14' rx='4' fill='none' stroke='%23ffffff' stroke-width='3.5'/%3E%3Cpath d='M17.5 43l3 3 5.5-6' fill='none' stroke='%2334d399' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cline x1='34' y1='43' x2='50' y2='43' stroke='%23ffffff' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" id="apple-touch-icon-link" href="">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="البابل شيت الذكي">
    <meta name="application-name" content="البابل شيت الذكي">
    <meta name="theme-color" id="meta-theme-color" content="#1e3a8a">

    <!-- Google Fonts: Cairo & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                        en: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        navy: {
                            800: '#1e3a8a',
                            900: '#172554',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Shared Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="test_solve" class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col">

    <!-- TOP NAVIGATION HEADER -->
    <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 h-16 flex items-center justify-between gap-2">
            <div class="flex items-center gap-3">
                <button onclick="attemptExitTestSolve()" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold text-xs flex items-center gap-1.5">
                    <i class="ph-bold ph-arrow-right text-base"></i>
                    <span>إنهاء وحفظ</span>
                </button>
                <div>
                    <h1 id="test-solve-title" class="font-extrabold text-sm sm:text-base leading-tight text-slate-900 dark:text-white">جاري تحميل الاختبار...</h1>
                    <p id="test-solve-subject-badge" class="text-[11px] text-blue-800 dark:text-blue-400 font-bold">المادة</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <span id="test-solve-progress-text" class="text-xs font-bold text-slate-500">تم حل 0 من 0</span>
                <button onclick="initiateSubmitTest()" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs sm:text-sm shadow-md flex items-center gap-1.5 transition-all active:scale-95">
                    <i class="ph-bold ph-paper-plane-tilt"></i>
                    <span>تسليم الاختبار</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN SOLVE INTERFACE -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-5 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Left: Question Display & Options (8 cols) -->
        <div class="lg:col-span-8 space-y-5">
            <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 sm:p-7 border border-slate-200 dark:border-slate-800 shadow-sm space-y-5">
                
                <!-- Top Question Header & Flags -->
                <div class="flex flex-wrap items-center justify-between gap-2 pb-4 border-b border-slate-100 dark:border-slate-800">
                    <div class="flex items-center gap-2.5">
                        <span id="tq-number-display" class="px-3.5 py-1.5 rounded-xl bg-blue-900 text-white font-black text-sm">سؤال ١</span>
                        <span id="tq-total-display" class="text-xs text-slate-500 font-bold">(عنصر ١ من ١)</span>
                        <span id="tq-type-badge" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300">اختيار من متعدد</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="toggleTestFlagCurrent()" id="flag-test-q-btn" class="px-3 py-1.5 rounded-xl text-xs font-bold border border-slate-200 dark:border-slate-700 flex items-center gap-1">
                            <i id="flag-test-icon" class="ph-bold ph-flag text-base"></i>
                            <span>معلّم للمراجعة</span>
                        </button>
                    </div>
                </div>

                <!-- Passage / Reading Text Box (if present) -->
                <div id="tq-passage-box" class="hidden p-4 rounded-2xl bg-amber-50/70 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800/60 text-xs sm:text-sm text-slate-800 dark:text-slate-200 leading-relaxed space-y-1">
                    <span class="font-extrabold text-amber-900 dark:text-amber-300 block"><i class="ph-bold ph-book-open"></i> اقرأ القطعة أو النص الآتي بعناية:</span>
                    <p id="tq-passage-text" class="whitespace-pre-line"></p>
                </div>

                <!-- Question Text & Image -->
                <div class="space-y-3">
                    <p id="tq-text-el" class="text-base sm:text-lg font-extrabold leading-relaxed text-slate-900 dark:text-white whitespace-pre-line"></p>
                    <div id="tq-img-wrap" class="hidden pt-2">
                        <img id="tq-img-el" src="" alt="صورة توضيحية للسؤال" onclick="openImageLightbox(this.src)" class="max-h-72 rounded-2xl border border-slate-300 dark:border-slate-700 cursor-zoom-in object-contain bg-white mx-auto shadow-sm">
                    </div>
                </div>

                <!-- MCQ Options Container -->
                <div id="tq-mcq-container" class="space-y-3 pt-2">
                    <span class="text-xs font-extrabold text-slate-500 block">اختر الإجابة الصحيحة:</span>
                    <div id="tq-options-grid" class="grid grid-cols-1 gap-3">
                        <!-- Options rendered dynamically with full text -->
                    </div>
                </div>

                <!-- Essay Container -->
                <div id="tq-essay-container" class="hidden space-y-4 pt-2">
                    <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-2">
                        <span class="text-xs font-extrabold text-slate-600 dark:text-slate-400 block">إجابتك المقالية:</span>
                        <textarea id="tq-essay-user-input" rows="4" oninput="saveTestEssayUserAnswer(this.value)" placeholder="اكتب إجابتك هنا..." class="w-full p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm font-bold focus:outline-none focus:border-blue-800"></textarea>
                    </div>

                    <div class="p-4 rounded-2xl bg-indigo-50/70 dark:bg-indigo-950/30 border border-indigo-200 dark:border-indigo-800 space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-extrabold text-indigo-900 dark:text-indigo-300">نموذج الإجابة والتقدير الذاتي:</span>
                            <button type="button" onclick="revealTestEssayAnswer()" id="tq-essay-reveal-btn" class="px-3 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow-sm">
                                إظهار نموذج الإجابة
                            </button>
                        </div>
                        <div id="tq-essay-model-wrap" class="hidden space-y-3">
                            <p id="tq-essay-model-text" class="text-xs sm:text-sm font-semibold text-slate-700 dark:text-slate-300 whitespace-pre-line"></p>
                            <div class="pt-2 border-t border-indigo-200 dark:border-indigo-800 flex items-center justify-between gap-2">
                                <span class="text-xs font-bold text-slate-600 dark:text-slate-400">قيّم إجابتك من 2:</span>
                                <div class="grid grid-cols-3 gap-2 w-full max-w-xs">
                                    <button type="button" onclick="gradeTestEssay(0)" class="test-essay-score-btn py-2 rounded-xl font-bold text-xs border border-slate-300 bg-white dark:bg-slate-900">0 (خطأ)</button>
                                    <button type="button" onclick="gradeTestEssay(1)" class="test-essay-score-btn py-2 rounded-xl font-bold text-xs border border-slate-300 bg-white dark:bg-slate-900">1 (جزء صحيح)</button>
                                    <button type="button" onclick="gradeTestEssay(2)" class="test-essay-score-btn py-2 rounded-xl font-bold text-xs border border-slate-300 bg-white dark:bg-slate-900">2 (إجابة كاملة)</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Navigation Controls inside card -->
                <div class="pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between gap-2">
                    <button type="button" onclick="prevTestQuestion()" id="prev-test-q-btn" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 font-bold text-xs flex items-center gap-1">
                        <i class="ph-bold ph-arrow-right"></i>
                        <span>السؤال السابق</span>
                    </button>
                    <button type="button" onclick="clearTestCurrentAnswer()" class="px-3 py-2 rounded-xl text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 font-bold text-xs">
                        مسح الإجابة
                    </button>
                    <button type="button" onclick="nextTestQuestion()" id="next-test-q-btn" class="px-4 py-2.5 rounded-xl bg-blue-900 hover:bg-blue-800 text-white font-bold text-xs flex items-center gap-1">
                        <span>السؤال التالي</span>
                        <i class="ph-bold ph-arrow-left"></i>
                    </button>
                </div>

            </div>
        </div>

        <!-- Right: Question Map Grid & Legend (4 cols) -->
        <div class="lg:col-span-4 space-y-4">
            <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
                    <h3 class="font-extrabold text-sm">خريطة أسئلة الاختبار</h3>
                    <span id="test-map-answered-ratio" class="text-xs font-bold text-blue-900 dark:text-blue-400">0 / 0</span>
                </div>

                <!-- Question Grid Map -->
                <div id="test-question-map-grid" class="grid grid-cols-5 gap-2 max-h-96 overflow-y-auto custom-scroll p-1">
                    <!-- Rendered dynamically -->
                </div>

                <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-[11px] font-bold text-slate-500">
                    <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-blue-900 inline-block"></span> محلول</span>
                    <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-slate-200 dark:bg-slate-800 inline-block"></span> لم يُجب</span>
                    <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-amber-500 inline-block"></span> مراجعة</span>
                </div>
            </div>
        </div>

    </main>

    <!-- STANDARD MODALS & SCRIPTS -->
    <div id="toast-container" class="fixed bottom-5 left-5 right-5 sm:left-auto sm:right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>
    <script src="app.js"></script>
</body>
</html>
